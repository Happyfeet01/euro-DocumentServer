name: Build standalone GHCR image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io/happyfeet01
  IMAGE_NAME: euro-documentserver
  BUILD_ROOT: /package

jobs:
  build:
    name: Build ${{ matrix.arch }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository and public submodules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image metadata
        id: meta
        shell: bash
        env:
          REF_NAME_RAW: ${{ github.ref_name }}
          REF_FULL: ${{ github.ref }}
        run: |
          set -euo pipefail
          VERSION=$(tr -d '[:space:]' < VERSION)
          REF_NAME=$(printf '%s' "$REF_NAME_RAW" | tr '/' '-')

          if [[ "$REF_FULL" == refs/tags/* ]]; then
            IMAGE_TAG="$REF_NAME"
          else
            IMAGE_TAG="latest"
          fi

          echo "product_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "image_tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"

      - name: Build and push standalone DocumentServer
        uses: docker/bake-action@4a9a8d494466d37134e2bfca2d3a8de8fb2681ad # v5.13.0
        with:
          workdir: ./build
          files: ./docker-bake.hcl
          targets: standalone
          push: false
          set: |
            standalone.tags=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.image_tag }}-${{ matrix.arch }}
            standalone.output=type=registry
            standalone.cache-from=type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }}
            standalone.cache-to=type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:buildcache-${{ matrix.arch }},mode=max
        env:
          REGISTRY: ${{ env.REGISTRY }}
          TAG: ${{ steps.meta.outputs.image_tag }}-${{ matrix.arch }}
          PRODUCT_VERSION: ${{ steps.meta.outputs.product_version }}
          BUILD_NUMBER: happyfeet.${{ github.run_number }}
          BUILD_ROOT: ${{ env.BUILD_ROOT }}
          NUGET_CACHE: local

  manifest:
    name: Publish multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish manifest
        shell: bash
        env:
          REF_NAME_RAW: ${{ github.ref_name }}
          REF_FULL: ${{ github.ref }}
          IMAGE_REGISTRY: ${{ env.REGISTRY }}
          IMAGE_REPOSITORY: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          REF_NAME=$(printf '%s' "$REF_NAME_RAW" | tr '/' '-')
          IMAGE="${IMAGE_REGISTRY}/${IMAGE_REPOSITORY}"

          if [[ "$REF_FULL" == refs/tags/* ]]; then
            SOURCE_TAG="$REF_NAME"
            TARGET_TAG="$REF_NAME"
          else
            SOURCE_TAG="latest"
            TARGET_TAG="latest"
          fi

          docker buildx imagetools create \
            -t "${IMAGE}:${TARGET_TAG}" \
            "${IMAGE}:${SOURCE_TAG}-amd64" \
            "${IMAGE}:${SOURCE_TAG}-arm64"

          # A tagged release also becomes the current :latest image.
          if [[ "$REF_FULL" == refs/tags/* ]]; then
            docker buildx imagetools create \
              -t "${IMAGE}:latest" \
              "${IMAGE}:${SOURCE_TAG}-amd64" \
              "${IMAGE}:${SOURCE_TAG}-arm64"
          fi
